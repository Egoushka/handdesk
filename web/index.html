<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>handdesk</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101216; color: #e8eaed; font: 16px system-ui, sans-serif; }
    #ui { z-index: 1; position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    button { font: inherit; padding: 14px 28px; border-radius: 10px; border: 0; background: #3b82f6; color: #fff; cursor: pointer; }
    button.alt { background: #374151; }
    #status { opacity: .8; max-width: 60ch; text-align: center; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>handdesk</h1>
    <div id="status"></div>
    <div id="link">Starting</div>
    <div>
      <button id="enter-ar">Enter AR (passthrough)</button>
      <button id="enter-vr" class="alt">Enter VR (environment)</button>
    </div>
  </div>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
