name: release

# A merge is the release: tag vX.Y.Z on main and this attaches the Mac build (agent plus page).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - run: cd agent && swift build -c release
      - name: Package
        run: |
          set -euo pipefail
          out=handdesk-${GITHUB_REF_NAME}-macos-arm64
          mkdir -p "$out"
          cp agent/.build/release/handdesk "$out/handdesk"
          cp -R web/dist "$out/web"
          cp README.md LICENSE "$out/"
          tar czf "$out.tar.gz" "$out"
          shasum -a 256 "$out.tar.gz" > "$out.tar.gz.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" handdesk-*.tar.gz handdesk-*.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
