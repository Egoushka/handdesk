name: release

# A merge is the release: tag vX.Y.Z on main and this attaches the Mac build (agent plus page).
# The build job has a read-only token and no cache; only the publish job can write releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cd web && npm ci && npm run build
      - run: cd agent && swift build -c release
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          out="handdesk-${TAG}-macos-arm64"
          mkdir -p "$out"
          cp agent/.build/release/handdesk "$out/handdesk"
          cp -R web/dist "$out/web"
          cp README.md LICENSE "$out/"
          tar czf "$out.tar.gz" "$out"
          shasum -a 256 "$out.tar.gz" > "$out.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            handdesk-*.tar.gz
            handdesk-*.sha256

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" handdesk-*.tar.gz handdesk-*.sha256 --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
